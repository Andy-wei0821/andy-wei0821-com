<link rel="stylesheet" href="assets/style.css" />
<style>
/* post-only styles */
.post-wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
.back { display: inline-block; font-size: 0.9rem; color: var(--muted); margin-bottom: 32px; border-bottom: none; }
.back:hover { color: var(--fg); }
.post-header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.post-header h1 { font-size: 1.9rem; font-weight: 700; line-height: 1.3; margin: 0 0 12px; letter-spacing: -0.3px; }
.post-header .meta { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); letter-spacing: 0.3px; }
.post-content { font-size: 1rem; line-height: 1.8; }
.post-content h1, .post-content h2, .post-content h3 { font-weight: 700; line-height: 1.3; margin: 1.6em 0 0.6em; }
.post-content h1 { font-size: 1.5rem; }
.post-content h2 { font-size: 1.25rem; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.post-content h3 { font-size: 1.1rem; }
.post-content p { margin: 0 0 1em; }
.post-content a { color: var(--fg); border-bottom: 1px solid var(--line); }
.post-content a:hover { border-bottom-color: var(--fg); }
.post-content ul, .post-content ol { padding-left: 1.4em; margin: 0 0 1em; }
.post-content li { margin: 0.3em 0; }
.post-content blockquote {
  margin: 1.2em 0; padding: 8px 0 8px 16px;
  border-left: 3px solid var(--fg);
  color: var(--muted);
}
.post-content code {
  font-family: var(--mono); font-size: 0.9em;
  background: var(--soft); border: 1px solid var(--line);
  padding: 1px 6px; border-radius: 3px;
}
.post-content pre {
  background: var(--soft); border: 1px solid var(--line);
  padding: 14px 16px; border-radius: 4px; overflow-x: auto;
  font-size: 0.88rem; line-height: 1.55;
}
.post-content pre code { background: none; border: none; padding: 0; }
.post-content hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
.post-content img { max-width: 100%; height: auto; }
.post-content table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.92rem; }
.post-content th, .post-content td { padding: 8px 12px; border: 1px solid var(--line); text-align: left; }
.post-content th { background: var(--soft); font-weight: 600; }
@media (max-width: 600px) {
  .post-wrap { padding: 24px 16px 60px; }
  .post-header h1 { font-size: 1.5rem; }
}
</style>
</head>
